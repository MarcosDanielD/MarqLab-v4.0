name: Deploy Marq Lab to VPS

# Disparo configurado para manual (workflow_dispatch).
# Ative o 'push' apenas quando configurar os secrets da VPS (VPS_HOST, VPS_SSH_KEY) no GitHub.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/marqlab
            git pull origin main || git pull origin master
            source .venv/bin/activate
            pip install -r requirements.txt --quiet
            sudo systemctl restart marqlab
            echo "Marq Lab atualizado com sucesso em produção!"
